services:
  - type: web
    name: web-assessment-workbench-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: web-assessment-workbench-db
          property: connectionString
      - key: AI_PROVIDER
        value: huggingface
      - key: HF_MODEL
        value: Qwen/Qwen3-4B-Instruct-2507:nscale
      - key: HF_TOKEN
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://web-assessment-workbench.vercel.app

databases:
  - name: web-assessment-workbench-db
    databaseName: assessment
    user: assessment
    plan: free
    region: singapore
