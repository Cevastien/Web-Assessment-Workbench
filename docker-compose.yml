services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://assessment:assessment@database:5432/assessment}
      ZAP_BASE_URL: ${ZAP_BASE_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-change-this-local-development-key}
    depends_on:
      database:
        condition: service_healthy
      zap:
        condition: service_started
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-assessment}
    volumes: ["assessment-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment"]
      interval: 10s
      timeout: 5s
      retries: 5
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:-change-this-local-development-key}
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.key=${ZAP_API_KEY:-change-this-local-development-key}", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/JSON/core/view/version/?apikey=$${ZAP_API_KEY:-change-this-local-development-key}' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  assessment-data:
